<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cloudflow - QC Gatekeeper</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/gatekeeper.css">
  <style>
    /* QC Tabs */
    .qc-tabs {
      display: flex;
      gap: 0;
      background: white;
      border-radius: 10px;
      border: 1px solid #e2e8f0;
      overflow: hidden;
      align-self: flex-start;
    }

    .qc-tab {
      padding: 10px 20px;
      font-size: 0.8125rem;
      font-weight: 600;
      color: #64748b;
      background: transparent;
      border: none;
      cursor: pointer;
      transition: all 0.15s;
      border-bottom: 2px solid transparent;
    }

    .qc-tab:hover {
      color: #334155;
      background: #f8fafc;
    }

    .qc-tab.active {
      color: #2563eb;
      border-bottom-color: #2563eb;
      background: #f8fafc;
    }

    .qc-tab-content {
      display: block;
    }

    .qc-tab-content.hidden {
      display: none;
    }

    /* Employee Search (Tab 2) */
    .qc-employee-search {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 1.25rem;
      display: flex;
      align-items: flex-end;
      gap: 12px;
      flex-wrap: wrap;
    }

    .qc-employee-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      min-width: 200px;
    }

    .qc-employee-field label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .qc-employee-input {
      padding: 10px 14px;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      font-size: 0.875rem;
      color: #0f172a;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .qc-employee-input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
    }

    .qc-employee-input::placeholder {
      color: #94a3b8;
    }

    .qc-search-btn {
      padding: 10px 24px;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.8125rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }

    .qc-search-btn:hover {
      background: #1d4ed8;
    }

    .qc-search-hint {
      font-size: 0.75rem;
      color: #94a3b8;
      margin-top: 2px;
    }

    .qc-no-results {
      text-align: center;
      padding: 3rem 1rem;
      color: #94a3b8;
      font-size: 0.875rem;
      background: white;
      border: 1px dashed #e2e8f0;
      border-radius: 10px;
    }

    .qc-no-results strong {
      color: #64748b;
    }

    .qc-results-count {
      font-size: 0.75rem;
      color: #64748b;
      background: #f1f5f9;
      padding: 4px 10px;
      border-radius: 6px;
      white-space: nowrap;
    }
  </style>
</head>

<body>
  <header class="header">
    <div class="logo-left">
      <img src="../Icons/cloud/cloud_24.svg" alt="Cloudflow Logo" class="logo-img">
      <span class="logo-text">Cloudflow</span>
    </div>
    <div class="header-right">
      <div class="search-wrapper">
        <img src="../Icons/search/search_24.svg" alt="Search" class="search-icon">
        <input type="text" class="search" placeholder="Search QC files...">
      </div>
      <div class="profile" id="profile">
        <img src="../Icons/user/user_24.svg" alt="Profile" class="profile-icon">
        <div class="profile-dropdown" id="profile-dropdown">
          <div class="profile-dropdown-header">
            <span class="profile-dropdown-email">qc@cloudflow.com</span>
            <span class="profile-dropdown-role">QC Team</span>
          </div>
          <div class="profile-dropdown-divider"></div>
          <a href="#" class="profile-dropdown-item">
            <svg class="profile-dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 16v-4" />
              <path d="M12 8h.01" />
            </svg>
            <span>Support</span>
          </a>
          <a href="#" class="profile-dropdown-item logout">
            <svg class="profile-dropdown-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span>Logout</span>
          </a>
        </div>
      </div>
    </div>
  </header>

  <div class="app-layout">
    <aside class="sidebar">
      <nav class="sidebar-nav">
        <div class="sidebar-menu">
          <a href="qc_overview.html" class="menu-item" data-page="qc-overview">
            <svg class="menu-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <rect x="3" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" />
              <rect x="14" y="3" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" />
              <rect x="3" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" />
              <rect x="14" y="14" width="7" height="7" rx="1.5" stroke="currentColor" stroke-width="1.5" />
            </svg>
            <span>Overview</span>
          </a>
          <a href="qc_vault.html" class="menu-item" data-page="qc-vault">
            <svg class="menu-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path
                d="M2 6C2 4.9 2.9 4 4 4H9L11 6H20C21.1 6 22 6.9 22 8V18C22 19.1 21.1 20 20 20H4C2.9 20 2 19.1 2 18V6Z"
                stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" />
              <path d="M2 10H22" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            <span>Vault</span>
          </a>
          <a href="qc_gatekeeper.html" class="menu-item active" data-page="qc-gatekeeper">
            <svg class="menu-icon" width="20" height="20" viewBox="0 0 24 24" fill="none"
              xmlns="http://www.w3.org/2000/svg">
              <path d="M16 4H18C19.1 4 20 4.9 20 6V20C20 21.1 19.1 22 18 22H6C4.9 22 4 21.1 4 20V6C4 4.9 4.9 4 6 4H8"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M15 2H9C8.4 2 8 2.4 8 3V5C8 5.6 8.4 6 9 6H15C15.6 6 16 5.6 16 5V3C16 2.4 15.6 2 15 2Z"
                stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M9 13L11 15L15 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
            </svg>
            <span>Gatekeeper</span>
          </a>
        </div>
      </nav>
    </aside>
    <main class="main-content" id="page-content">
      <div class="gatekeeper">
        <div class="overview-header">
          <div>
            <h1 class="page-title">QC Gatekeeper</h1>
            <p class="page-subtitle">Review and verify production files — QC review queue</p>
          </div>
          <div class="header-actions">
            <span class="update-badge" id="gk-queue-count">— files in queue</span>
          </div>
        </div>

        <!-- Tabs -->
        <div class="qc-tabs">
          <button class="qc-tab active" data-tab="all">All Production Files</button>
          <button class="qc-tab" data-tab="checked">QC Checking Files</button>
        </div>

        <!-- Tab 1: All Production Files -->
        <div class="qc-tab-content" id="tab-all">
          <div class="gk-split">
            <div class="gk-left">
              <div class="gk-queue-header">
                <h2 class="gk-card-title">Production Files</h2>
                <span class="card-badge" id="gk-queue-badge">Queue</span>
              </div>
              <div class="gk-queue list-view" id="gk-queue">
                <!-- file cards injected by JS -->
              </div>
            </div>
          </div>
        </div>

        <!-- Tab 2: QC Checking Files -->
        <div class="qc-tab-content hidden" id="tab-checked">
          <div class="gk-left">
            <div class="gk-queue-header">
              <h2 class="gk-card-title">Files for QC</h2>
              <span class="qc-results-count" id="checked-count">0 files</span>
            </div>
            <div class="gk-queue list-view" id="checked-queue">
              <!-- filtered file cards injected by JS -->
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>

  <script src="../js/data.js"></script>
  <script>
(function () {
    var queue = document.getElementById('gk-queue');
    var checkedQueue = document.getElementById('checked-queue');
    var queueCount = document.getElementById('gk-queue-count');
    var queueBadge = document.getElementById('gk-queue-badge');
    var checkedCount = document.getElementById('checked-count');

    // Load assigned files from localStorage
    var assignedFiles = JSON.parse(localStorage.getItem('qcAssignedFiles') || '{"0":{"empId":"234561","assignedAt":"2026-07-28T10:00:00.000Z"},"1":{"empId":"234561","assignedAt":"2026-07-28T10:00:00.000Z"},"2":{"empId":"234561","assignedAt":"2026-07-28T10:00:00.000Z"}}');

    function saveAssignedFiles() {
      localStorage.setItem('qcAssignedFiles', JSON.stringify(assignedFiles));
    }

    function renderCheckedQueue() {
      checkedQueue.innerHTML = '';
      var assignedIds = Object.keys(assignedFiles);
      if (assignedIds.length === 0) {
        checkedCount.textContent = '0 files';
        checkedQueue.innerHTML = '<div class="qc-no-results">No files assigned to QC yet. Assign files from the <strong>All Production Files</strong> tab.</div>';
        return;
      }
      checkedCount.textContent = assignedIds.length + ' file' + (assignedIds.length > 1 ? 's' : '');
      assignedIds.forEach(function (fileId) {
        var assignment = assignedFiles[fileId];
        var file = FILES.find(function (f) { return f.id === fileId; });
        if (file) {
          var card = createCheckedFileCard(file, assignment.empId);
          checkedQueue.appendChild(card);
        }
      });
    }

    function createFileCard(f) {
      var card = document.createElement('div');
      card.className = 'gk-file-card';
      var isAssigned = !!assignedFiles[f.id];
      card.innerHTML =
        '<div class="gk-file-card-top">' +
        '<div class="gk-file-card-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z"/><path d="M14 2V8H20"/></svg></div>' +
        '<div class="gk-file-card-info">' +
        '<div class="gk-file-card-name">' + f.name + '</div>' +
        '<div class="gk-file-card-meta">' + f.meta + '</div>' +
        '</div>' +
        '<a href="history.html?file=' + f.id + '" class="gk-history-btn" title="Version History" aria-label="Version History">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>' +
        '</a>' +
        '</div>' +
        (isAssigned
          ? '<span class="gk-file-card-badge stage-green" style="background:#dcfce7;color:#166534;">Assigned to QC: ' + assignedFiles[f.id].empId + '</span>'
          : '<div class="gk-qc-assign" style="display: flex; align-items: center; gap: 8px; margin-left: auto; padding-left: 12px;">' +
            '<label for="qc-emp-' + f.id + '" style="font-size: 0.65rem; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em;">QC Emp ID</label>' +
            '<input type="text" id="qc-emp-' + f.id + '" class="qc-employee-input" placeholder="e.g. 100001" style="padding: 6px 10px; border: 1px solid #e2e8f0; border-radius: 6px; font-size: 0.75rem; color: #0f172a; outline: none; min-width: 100px; width: 120px; transition: border-color 0.15s, box-shadow 0.15s;">' +
            '<button class="btn btn-primary gk-qc-assign-btn" type="button" data-file-id="' + f.id + '" style="padding: 6px 12px; font-size: 0.7rem;">Assign</button>' +
            '</div>') +
        '<button class="btn btn-secondary gk-open-btn" type="button" data-id="' + f.id + '">Open Viewer</button>';
      return card;
    }

    function createCheckedFileCard(f, empId) {
      var card = document.createElement('div');
      card.className = 'gk-file-card';
      card.innerHTML =
        '<div class="gk-file-card-top">' +
        '<div class="gk-file-card-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6C5.46957 2 4.96086 2.21071 4.58579 2.58579C4.21071 2.96086 4 3.46957 4 4V20C4 20.5304 4.21071 21.0391 4.58579 21.4142C4.96086 21.7893 5.46957 22 6 22H18C18.5304 22 19.0391 21.7893 19.4142 21.4142C19.7893 21.0391 20 20.5304 20 20V8L14 2Z"/><path d="M14 2V8H20"/></svg></div>' +
        '<div class="gk-file-card-info">' +
        '<div class="gk-file-card-name">' + f.name + '</div>' +
        '<div class="gk-file-card-meta">' + f.meta + '</div>' +
        '</div>' +
        '<a href="history.html?file=' + f.id + '" class="gk-history-btn" title="Version History" aria-label="Version History">' +
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>' +
        '</a>' +
        '<span class="gk-file-card-badge stage-green" style="background:#dcfce7;color:#166534;">QC: ' + empId + '</span>' +
        '</div>' +
        '<button class="btn btn-secondary gk-open-btn" type="button" data-id="' + f.id + '">Open Viewer</button>';
      return card;
    }

    // --- Tab 1: All production files ---
    FILES.forEach(function (f) {
      queue.appendChild(createFileCard(f));
    });
    queueCount.textContent = FILES.length + ' files in queue';
    queueBadge.textContent = FILES.length + ' files';

    // QC Assign functionality (per file card)
    queue.addEventListener('click', function (e) {
      var assignBtn = e.target.closest('.gk-qc-assign-btn');
      if (assignBtn) {
        var fileId = assignBtn.getAttribute('data-file-id');
        var empInput = document.getElementById('qc-emp-' + fileId);
        var empId = empInput.value.trim();
        if (!empId) {
          alert('Please enter an Employee ID');
          empInput.focus();
          return;
        }
        var matched = FILES.filter(function (f) {
          return f.name.indexOf(empId) === 0;
        });
        if (matched.length === 0) {
          alert('No files found for Employee ID: ' + empId);
          return;
        }
        // Assign all matching files to this QC
        matched.forEach(function (f) {
          assignedFiles[f.id] = { empId: empId, assignedAt: new Date().toISOString() };
        });
        saveAssignedFiles();
        alert('Assigned ' + matched.length + ' file(s) to QC Employee ' + empId);
        empInput.value = '';
        // Re-render both queues
        queue.innerHTML = '';
        FILES.forEach(function (f) {
          queue.appendChild(createFileCard(f));
        });
        renderCheckedQueue();
        return;
      }
      var openBtn = e.target.closest('.gk-open-btn');
      if (openBtn) window.location.href = 'viewer.html?file=' + openBtn.getAttribute('data-id') + '&from=qc_gatekeeper';
    });

    // Initial render of Tab 2
    renderCheckedQueue();

      // --- Tab switching ---
      var tabs = document.querySelectorAll('.qc-tab');
      var tabContents = {
        all: document.getElementById('tab-all'),
        checked: document.getElementById('tab-checked')
      };

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          tabs.forEach(function (t) { t.classList.remove('active'); });
          tab.classList.add('active');

          Object.keys(tabContents).forEach(function (key) {
            tabContents[key].classList.toggle('hidden', key !== tab.getAttribute('data-tab'));
          });
        });
      });

      checkedQueue.addEventListener('click', function (e) {
        var openBtn = e.target.closest('.gk-open-btn');
        if (openBtn) window.location.href = 'viewer.html?file=' + openBtn.getAttribute('data-id') + '&from=qc_gatekeeper';
      });

      // Profile dropdown
      (function () {
        var profile = document.getElementById('profile');
        var dropdown = document.getElementById('profile-dropdown');
        if (!profile || !dropdown) return;

        profile.addEventListener('click', function (e) {
          e.stopPropagation();
          profile.classList.toggle('open');
        });

        document.addEventListener('click', function (e) {
          if (!profile.contains(e.target)) {
            profile.classList.remove('open');
          }
        });
      })();
    })();
  </script>
  <script src="../js/auth.js"></script>
</body>

</html>
